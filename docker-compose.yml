version: '3.9'

services:
  realtime-map-app:
    image: realtime-map-app
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8010:8000"
    volumes:
      - ./src:/app/src:delegated
    environment:
      - PYTHONUNBUFFERED=1
    working_dir: /app/src/webview
    command: ["uvicorn", "app:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
