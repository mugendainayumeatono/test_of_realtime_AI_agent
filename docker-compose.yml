version: '3.9'

services:
  realtime-ai-agent:
    image: realtime-ai-agent
    container_name: realtime-ai-agent
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8010:8000"
      - "8020:8020"
    volumes:
      - ./src:/app/src:delegated
      - ./logs:/app/logs
      - /etc/localtime:/etc/localtime:ro
    environment:
      - PYTHONUNBUFFERED=1
      - WEBVIEW_URL=http://127.0.0.1:8000
      - PILOT_URL=http://127.0.0.1:8020
      - AI_CLIENT_TYPE=openai
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_API_BASE=http://gemini-cli-proxy:8765
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_API_BASE=http://gemini-cli-proxy:8765
    env_file:
      - .env
    logging:
      driver: "k8s-file"
      options:
        max-size: "10m"
    networks:
      - default
      - gemini-proxy-network

networks:
  default:
    name: test_of_realtime_ai_agent_default
  gemini-proxy-network:
    external: true
