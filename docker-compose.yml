version: '3.9'

services:
  realtime-ai-agent:
    image: realtime-ai-agent
    container_name: realtime-ai-agent
    build:
      context: .
      dockerfile: Dockerfile
    network_mode: host

    volumes:
      - ./src:/app/src:delegated
      - ./logs:/app/logs
      - ./config.json:/app/config.json:ro
      - /etc/localtime:/etc/localtime:ro
    environment:
      - PYTHONUNBUFFERED=1
      - PLATFORM_PORT=8010
      - PLATFORM_URL=http://127.0.0.1:8010
    logging:
      driver: "k8s-file"
      options:
        max-size: "10m"
