version: '3.9'

services:
  realtime-ai-agent:
    image: realtime-ai-agent
    container_name: realtime-ai-agent
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8010:8000"

    volumes:
      - ./src:/app/src:delegated
      - ./logs:/app/logs
      - ./config.json:/app/config.json:ro
      - /etc/localtime:/etc/localtime:ro
    environment:
      - PYTHONUNBUFFERED=1
      - PLATFORM_URL=http://127.0.0.1:8000
    logging:
      driver: "k8s-file"
      options:
        max-size: "10m"
    networks:
      - default
      - gemini-proxy-network

networks:
  default:
    name: test_of_realtime_ai_agent_default
  gemini-proxy-network:
    external: true
