[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "realtime-ai-agent"
version = "0.2.0"
description = "实时航空多智能体协同与数字孪生空域系统"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.23.0",
  "google-generativeai>=0.8.0",
  "httpx>=0.27.0",
  "openai>=2.40.0",
  "python-dotenv>=1.0.0",
]

[tool.setuptools.package-data]
"*" = ["*.txt", "*.html", "*.js", "*.css"]

