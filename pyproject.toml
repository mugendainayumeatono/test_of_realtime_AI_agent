[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "realtime-map-app"
version = "0.1.0"
description = "实时地图物体模拟 Web 应用"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.23.0",
  "google-generativeai>=0.8.0",
  "httpx>=0.27.0",
  "openai>=2.40.0",
]
