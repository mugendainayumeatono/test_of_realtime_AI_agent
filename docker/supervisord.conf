[supervisord]
nodaemon=true
user=root
logfile=/app/logs/supervisord.log
logfile_maxbytes=10MB
logfile_backups=2
pidfile=/tmp/supervisord.pid

[program:webview]
directory=/app/src/webview
command=/app/.venv/bin/uvicorn app:app --host 0.0.0.0 --port 8000 --reload
autostart=true
autorestart=true
priority=10
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:agent_pilot]
directory=/app/src/agent_pilot
command=/app/.venv/bin/uvicorn pilot:app --host 0.0.0.0 --port 8020 --reload
autostart=true
autorestart=true
priority=20
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:agent_controller]
directory=/app/src/agent_controller
command=/app/.venv/bin/python controller.py
autostart=true
autorestart=true
priority=30
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
